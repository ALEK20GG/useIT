services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: useit-qdrant
    ports:
      - "6333:6333"   # HTTP API (usato dal backend)
      - "6334:6334"   # gRPC API (opzionale)
    volumes:
      # Monta la cartella locale qdrant_storage come storage persistente.
      # I dati sopravvivono al riavvio del container.
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
