<!DOCTYPE html>
<html lang="it">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hub SSO (test) — login</title>
	<style>
		body { font-family: system-ui, sans-serif; max-width: 520px; margin: 3rem auto; padding: 0 1rem; color: #111; }
		h1 { font-size: 1.35rem; margin-bottom: 0.5rem; }
		p.muted { color: #555; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
		label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
		input[type="email"] { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
		button { margin-top: 1.25rem; padding: 0.65rem 1.25rem; font-size: 1rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer;
			background: linear-gradient(135deg, #4f46e5, #6366f1); color: white; }
		button:hover { opacity: 0.92; }
		.hint { font-size: 0.8rem; color: #666; margin-top: 1rem; }
	</style>
</head>
<body>
	<h1>Hub SSO (simulazione produzione)</h1>
	<p class="muted">
		Questo è il server “portale”. Dopo <strong>Accedi</strong> firmiamo un JWT e reindirizziamo il browser al client UseIt con <code>?token=…</code>
		(che il client verifica e decodifica).
	</p>
	<form method="get" action="{{ url_for('stub_portal') }}">
		<input type="hidden" name="go" value="1">
		<label for="email">Email utente</label>
		<input id="email" name="email" type="email" value="{{ default_email }}" required autocomplete="username">
		<button type="submit">Accedi e invia JWT al client</button>
	</form>
	<p class="hint">Flusso rapido (senza form): <code>/stub-portal?go=1&amp;email=…</code></p>
</body>
</html>
